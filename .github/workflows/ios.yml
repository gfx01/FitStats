name: iOS build (unsigned IPA)

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project FitStats.xcodeproj \
            -scheme FitStats \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/FitStats.app

      - name: Compiler errors
        if: failure()
        working-directory: ios
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Package IPA
        working-directory: ios
        run: |
          rm -rf Payload FitStats.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FitStats.app Payload/
          # Ad-hoc signed with the app group, widget first: signing apps read the entitlements
          # from the binaries to know which capabilities (here the shared app group) to set up.
          WIDGET=Payload/FitStats.app/PlugIns/FitStatsWidget.appex
          test -d "$WIDGET" || { echo "::error::The widget extension is missing from the app"; exit 1; }
          codesign --force --sign - --entitlements Entitlements/FitStatsWidget.entitlements "$WIDGET"
          codesign --force --sign - --entitlements Entitlements/FitStats.entitlements Payload/FitStats.app
          codesign -d --entitlements - "$WIDGET"
          codesign -d --entitlements - Payload/FitStats.app
          zip -qry FitStats.ipa Payload
          ls -lh FitStats.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FitStats-ipa
          path: ios/FitStats.ipa
          retention-days: 30

      # Stable download link: Releases → "FitStats (latest build)".
      - name: Publish release asset
        if: github.event_name != 'pull_request'
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-latest --cleanup-tag --yes || true
          gh release create build-latest FitStats.ipa \
            --title "FitStats (latest build)" \
            --notes "IPA (sign it yourself) built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install it with your signing app; see SETUP.md. Includes the widget extension (one more App ID)." \
            --prerelease \
            --target "$GITHUB_SHA"
